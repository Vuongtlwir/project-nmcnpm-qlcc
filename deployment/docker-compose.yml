version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: qlcc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qlcc_db
    ports:
      - '3306:3306'
    volumes:
      - ../database:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql

volumes:
  db_data:
